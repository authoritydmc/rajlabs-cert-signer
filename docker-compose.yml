services:
  cert-signer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rajlabs-cert-signer
    restart: unless-stopped
    ports:
      - "${PORT:-9000}:9000"
    environment:
      - PORT=9000
      - BASE_URL=${BASE_URL:-http://localhost:9000}
      - CA_NAME=${CA_NAME:-int-server}
      - DAYS_VALID=${DAYS_VALID:-90}
      - AUTH_TOKEN=${AUTH_TOKEN:-rajlabs-secure-api-key-9988}
      # In Coolify, you can also paste these directly as environment variables:
      - INTERMEDIATE_CERT_PEM=${INTERMEDIATE_CERT_PEM:-}
      - INTERMEDIATE_KEY_PEM=${INTERMEDIATE_KEY_PEM:-}
      - ROOT_CERT_PEM=${ROOT_CERT_PEM:-}
    volumes:
      # Persistent database, serial numbers, CRLs, and issued certificates
      - cert_signer_data:/app/data
      # Optional host mounts (if not using env variables)
      - ./mounted-ca/certs:/app/ca-certs:ro
      - ./mounted-ca/private:/app/ca-keys:ro

volumes:
  cert_signer_data:
    driver: local
